on:
    push:
        branches:
            - main
permissions:
    contents: read
    pages: write
    id-token: write

jobs:
    build:
        permissions:
            contents: read
            pages: write
            id-token: write
        runs-on: ubuntu-latest
        steps:
            - name: Checkout the branch
              uses: actions/checkout@v5
            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            - name: Install Dependencies
              run: npm ci
            - name: Build Project
              run: npm run build
            - name: Deploy 🚀
              uses: JamesIves/github-pages-deploy-action@v4
              with:
                clean: true
                folder: dist